{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Logistique Pro</title>
       <style>

        :root {

            --primary: #f4c430;

            --bg: #0f2a44;

            --border: rgba(255, 255, 255, 0.1);

        }

        body {

            background: var(--bg);

            color: white;

            font-family: 'Segoe UI', sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            height: 100vh;

            margin: 0;

            background: linear-gradient(135deg, #0f2a44 0%, #163a5f 100%);

        }

        .auth-card {

            background: rgba(255,255,255,0.05);

            padding: 40px;

            border-radius: 15px;

            border: 1px solid var(--border);

            width: 100%;

            max-width: 380px;

            backdrop-filter: blur(10px);

            box-shadow: 0 15px 35px rgba(0,0,0,0.2);

        }

        h2 { color: var(--primary); text-align: center; margin-bottom: 30px; font-size: 1.8rem; }

        .form-group { margin-bottom: 20px; }

        label { display: block; font-size: 13px; color: #aaa; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; }

        input, select {

            width: 100%;

            padding: 12px;

            background: rgba(0,0,0,0.3);

            border: 1px solid var(--border);

            border-radius: 8px;

            color: white;

            box-sizing: border-box;

            font-size: 1rem;

            transition: 0.3s;

        }

        input:focus, select:focus { border-color: var(--primary); outline: none; background: rgba(0,0,0,0.4); }

        .btn {

            width: 100%;

            padding: 14px;

            background: var(--primary);

            border: none;

            border-radius: 8px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 15px;

            color: #0f2a44;

            font-size: 1rem;

            text-transform: uppercase;

            transition: 0.3s;

        }

        .btn:hover { background: #e0b22a; transform: translateY(-2px); }

        .links { margin-top: 25px; text-align: center; font-size: 14px; color: #aaa; }

        a { color: var(--primary); text-decoration: none; cursor: pointer; font-weight: 600; }

        a:hover { text-decoration: underline; }

    </style>
</head>
<body>

<div class="auth-card">
    <div class="logo-container">
        <h2>🚚 Accès Système </h2>
    </div>
    
    {% if messages %}
        {% for message in messages %}
            <div class="error-msg">⚠️ {{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        

        <div class="form-group">
            <label for="username">Nom d'utilisateur</label>
            <input type="text" name="username" id="username" placeholder="votre.nom" required>
        </div>

        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" name="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn">Accéder au portail</button>
    </form>

    <div class="links">
        <a href="{% url 'index' %}"> return</a>
        <div style="margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px;">
            Nouveau partenaire ? <a href="{% url 'signin' %}">Créer un compte</a>
        </div>

    </div>
</div>


</body>
</html>
